[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "innosoft_app"
version = "0.0.1"
description = "innosoft_app is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.11.0"
features = [
    "splent-io/splent_feature_redis@v1.5.6",
    "splent-io/splent_feature_nginx@v1.1.0",
    "splent_io/splent_feature_theme@v0.2.1",
    "splent_io/splent_feature_team@v0.2.1",
    "splent_io/splent_feature_events@v0.1.2",
    "splent_io/splent_feature_skin_arcade@v0.2.1",
    "splent_io/splent_feature_auth@v1.6.2",
    "splent_io/splent_feature_public@v1.7.2",
    "splent_io/splent_feature_session_redis@v1.1.1",
    "splent_io/splent_feature_media@v0.4.2",
    "splent_io/splent_feature_settings@v0.2.1",
]
features_dev = [
    "splent_io/splent_feature_admin@v1.1.1",
]
features_prod = []
spl = "cms_spl"

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.21610307"
concept_doi = ""
version = ""
file = "cms_spl.uvl"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
